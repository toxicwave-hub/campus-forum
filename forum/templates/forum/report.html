{% extends 'forum/base.html' %}

{% block title %}举报 // CYBER FORUM{% endblock %}

{% block content %}
    <section class="hero">
        <h1 style="font-size: 32px;">举报</h1>
        <p class="welcome">举报对象：{{ target_label }}</p>
    </section>

    <form class="form-card" method="post">
        {% csrf_token %}
        {% for field in form %}
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
        {% endfor %}

        <div style="margin-top: 22px; display: flex; gap: 8px;">
            <button class="button button-danger" type="submit">提交举报</button>
            <a class="button button-ghost" href="{{ cancel_url }}">取消</a>
        </div>
    </form>
{% endblock %}
