{% extends 'forum/base.html' %}

{% block title %}校园论坛{% endblock %}

{% block content %}
    <section class="hero">
        <h1>校园论坛</h1>
        <p class="welcome">欢迎来到校园论坛，这里可以交流学习、项目、实验和技术问题。</p>
    </section>

    <section>
        <h2 class="section-title">热门板块</h2>
        <div class="cards">
            <article class="card">
                <h3>化工学习</h3>
                <p>整理课程笔记、实验思路和学习资料，互相补充知识点。</p>
            </article>
            <article class="card">
                <h3>AI 工具</h3>
                <p>讨论 AI 辅助学习、代码、资料整理和日常效率工具。</p>
            </article>
            <article class="card">
                <h3>项目交流</h3>
                <p>分享项目想法、进度记录和遇到的问题，一起推进作品。</p>
            </article>
        </div>
    </section>
{% endblock %}
