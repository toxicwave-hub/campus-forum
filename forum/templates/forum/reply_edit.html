{% extends 'forum/base.html' %}

{% block title %}编辑回帖{% endblock %}

{% block content %}
    <section class="hero"><h1 style="font-size: 32px;">编辑回帖</h1>
        <p class="welcome">来自 <a href="{% url 'post_detail' reply.post.pk %}">《{{ reply.post.title }}》</a></p></section>

    <form class="form-card" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% if form.non_field_errors %}<div class="error">{{ form.non_field_errors }}</div>{% endif %}
        <label for="{{ form.content.id_for_label }}">{{ form.content.label }}</label>
        {{ form.content }}{{ form.content.errors }}
        <label class="upload-label" style="margin-top: 14px;">📎 {{ form.attachments.label }}{{ form.attachments }}</label>
        <div style="margin-top: 22px; display: flex; gap: 8px;">
            <button class="button" type="submit">保存</button>
            <a class="button button-ghost" href="{% url 'post_detail' reply.post.pk %}">取消</a>
        </div>
    </form>
{% endblock %}
